<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Codex Reset">
  <style>
    /* Backlit panel: what a tab strip is, most of the time. */
    .board { fill: #101114; }
    .route { stroke: #f4f5f7; stroke-opacity: .55; }
    .stop  { fill: #5b93ff; stroke: #101114; }
    /* Printed panel, for dark browser chrome: the same mark, inverted materials. */
    @media (prefers-color-scheme: dark) {
      .board { fill: #f5f6f8; }
      .route { stroke: #12161f; stroke-opacity: .7; }
      .stop  { fill: #1b5fd9; stroke: #f5f6f8; }
    }
  </style>
  <rect class="board" width="64" height="64" rx="14"/>
  <line class="route" x1="-2" y1="32" x2="66" y2="32" stroke-width="6"/>
  <rect class="stop" x="18" y="22" width="28" height="20" rx="2.5" stroke-width="6"/>
</svg>
