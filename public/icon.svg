<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Codex Reset">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd"/>
      <stop offset="1" stop-color="#dde5f0"/>
    </linearGradient>
  </defs>
  <!-- A printed plate: the same material as the timetable boards on the page. -->
  <rect width="64" height="64" rx="15" fill="url(#plate)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="rgba(18,21,29,.13)" stroke-width="1.5"/>
  <!-- The cycle split in two: the run so far in graphite, the stretch left to the next reset in amber. -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#f97316" stroke-width="6.5" stroke-linecap="round"
          stroke-dasharray="39.8 119.4" transform="rotate(280 32 32)"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1d222b" stroke-width="6.5" stroke-linecap="round"
          stroke-dasharray="66.3 119.4" transform="rotate(60 32 32)"/>
</svg>
