name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: 101.133.168.66
      SERVER_USER: root
      SSH_PORT: '22'
      SSH_KEY: ${{ runner.temp }}/codex-reset-deploy-key
      SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/codex-reset-known-hosts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: 配置部署专用 SSH 密钥和服务器指纹
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_FILE"

      - name: 检查、发布并核对公网版本
        run: npm run deploy

      - name: 发布结果
        run: |
          printf '已部署提交 `%s`。\n\n[打开网站](https://codex-reset.opentunnel.asia/)\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: 清理临时凭据
        if: always()
        run: rm -f "$SSH_KEY" "$SSH_KNOWN_HOSTS_FILE"
