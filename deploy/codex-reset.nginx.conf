server {
    listen 80;
    listen [::]:80;
    server_name codex-reset.opentunnel.asia;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /www/wwwroot/codex-reset.opentunnel.asia;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name codex-reset.opentunnel.asia;
    ssl_certificate /www/server/panel/vhost/cert/codex-reset.opentunnel.asia/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/codex-reset.opentunnel.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CODEX_RESET_TLS:1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /www/wwwlogs/codex-reset.opentunnel.asia.log;
    error_log /www/wwwlogs/codex-reset.opentunnel.asia.error.log;
    location / {
        include /root/codex-reset/active-proxy.conf;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
